[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geochem-robust-workflow"
version = "0.1.0"
description = "Reproducible geochemical anomaly mapping with SGS, fractal analysis, spatial validation, SHAP and correlation networks"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Authors of CAGEO-S-26-02501"}]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "gstatsim>=1.2.0",
  "networkx>=3.1",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
explain = ["shap>=0.45"]
test = ["pytest>=8.0"]

[project.scripts]
geochem-workflow = "geochem_workflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
